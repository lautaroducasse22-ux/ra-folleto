<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Folleto con realidad aumentada</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    body { margin: 0; }
    #burbuja {
      position: fixed; z-index: 10; display: none;
      left: 50%; top: 22%; transform: translate(-50%, -100%);
      width: min(84vw, 380px); box-sizing: border-box;
      padding: 14px 16px 10px; background: #fff; color: #222;
      border: 3px solid #222; border-radius: 22px;
      box-shadow: 0 4px 0 rgba(0,0,0,0.25);
      font-family: sans-serif; font-size: 16px; line-height: 1.35;
      cursor: pointer; user-select: none; -webkit-user-select: none; touch-action: manipulation;
    }
    /* colita de la burbuja (apunta hacia la arqueóloga) */
    #burbuja::before {
      content: ""; position: absolute; left: 50%; bottom: -17px; transform: translateX(-50%);
      border: 12px solid transparent; border-top: 16px solid #222; border-bottom: 0;
    }
    #burbuja::after {
      content: ""; position: absolute; left: 50%; bottom: -11px; transform: translateX(-50%);
      border: 10px solid transparent; border-top: 13px solid #fff; border-bottom: 0;
    }
    #inicio {
      position: fixed; inset: 0; z-index: 20;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: #1b1b1b; color: #fff; font-family: sans-serif; text-align: center; padding: 24px;
    }
    #inicio h2 { margin: 0 0 8px; }
    #inicio p { margin: 6px 0; max-width: 320px; line-height: 1.4; }
    #inicio button {
      font-size: 20px; padding: 16px 34px; border: 0; border-radius: 999px;
      background: #fff; color: #1b1b1b; margin-top: 22px;
    }
    #oculto { opacity: 0; }
    #pie { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; font-size: 13px; color: #666; }
    #puntos { letter-spacing: 3px; }
  </style>
</head>
<body>

  <div id="inicio">
    <h2>Realidad aumentada</h2>
    <p>Tocá el botón, permití la cámara y apuntá al folleto.</p>
    <p>🔊 Subí el volumen para escuchar a la arqueóloga.</p>
    <button id="btn">Tocar para comenzar</button>
  </div>

  <div id="burbuja">
    <div><span id="visible"></span><span id="oculto"></span></div>
    <div id="pie"><span id="puntos"></span><span id="aviso"></span></div>
  </div>

  <a-scene mindar-image="imageTargetSrc: ./targets.mind; autoStart: false;"
           color-space="sRGB"
           renderer="colorManagement: true, physicallyCorrectLights"
           vr-mode-ui="enabled: false"
           device-orientation-permission-ui="enabled: false">

    <a-assets>
      <img id="i-cuerpo" src="./cuerpo.png">
      <img id="i-cabeza" src="./cabeza.png">
      <img id="i-ojos-abiertos" src="./ojos-abiertos.png">
      <img id="i-ojos-cerrados" src="./ojos-cerrados.png">
      <img id="i-boca-cerrada" src="./boca-cerrada.png">
      <img id="i-boca-abierta" src="./boca-abierta.png">
      <img id="i-brazo" src="./brazo.png">
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity id="objetivo" mindar-image-target="targetIndex: 0">

      <!-- "grupo" es toda la arqueóloga. Su tamaño y posición se ajustan en el script (ALTO, X, Y, Z).
           Adentro, cada parte mide 1 de ancho por 2.7251 de alto (la proporción de tus PNG). -->
      <a-entity id="grupo">
        <!-- punto de anclaje de la burbuja (encima del sombrero) -->
        <a-entity id="ancla-burbuja" position="-0.04 1.40 0.05"></a-entity>
        <a-entity animation="property: position; from: 0 0 0; to: 0 0.03 0; dir: alternate; dur: 1800; loop: true; easing: easeInOutSine">

          <a-image data-orden="1" src="#i-cuerpo" width="1" height="2.7251" position="0 0 0"
                   material="shader: flat; transparent: true; depthWrite: false"></a-image>

          <!-- Brazo: gira desde el codo, como un saludo -->
          <a-entity position="0.2669 0.3267 0">
            <a-entity animation="property: rotation; from: 0 0 -5; to: 0 0 5; dir: alternate; dur: 900; loop: true; easing: easeInOutSine">
              <a-image data-orden="2" src="#i-brazo" width="1" height="2.7251" position="-0.2669 -0.3267 0"
                       material="shader: flat; transparent: true; depthWrite: false"></a-image>
            </a-entity>
          </a-entity>

          <!-- Cabeza y cara: se inclinan apenas desde el cuello -->
          <a-entity position="-0.0378 0.7848 0">
            <a-entity animation="property: rotation; from: 0 0 -1.5; to: 0 0 1.5; dir: alternate; dur: 2200; loop: true; easing: easeInOutSine">
              <a-entity position="0.0378 -0.7848 0">
                <a-image data-orden="3" src="#i-cabeza" width="1" height="2.7251" position="0 0 0"
                         material="shader: flat; transparent: true; depthWrite: false"></a-image>
                <a-image data-orden="4" id="ojos-abiertos" src="#i-ojos-abiertos" width="1" height="2.7251" position="0 0 0"
                         material="shader: flat; transparent: true; depthWrite: false"></a-image>
                <a-image data-orden="4" id="ojos-cerrados" src="#i-ojos-cerrados" width="1" height="2.7251" position="0 0 0" visible="false"
                         material="shader: flat; transparent: true; depthWrite: false"></a-image>
                <a-image data-orden="5" id="boca-cerrada" src="#i-boca-cerrada" width="1" height="2.7251" position="0 0 0"
                         material="shader: flat; transparent: true; depthWrite: false"></a-image>
                <a-image data-orden="5" id="boca-abierta" src="#i-boca-abierta" width="1" height="2.7251" position="0 0 0" visible="false"
                         material="shader: flat; transparent: true; depthWrite: false"></a-image>
              </a-entity>
            </a-entity>
          </a-entity>

        </a-entity>
      </a-entity>
    </a-entity>
  </a-scene>

  <script>
    // ===== AJUSTES DE TAMAÑO Y POSICIÓN =====
    // El ancho del folleto vale 1 y el alto vale 0.71 (tu folleto es apaisado). Los bordes son X: -0.5 a 0.5 e Y: -0.35 a 0.35.
    const ALTO = 0.7;   // alto de la arqueóloga. 0.7 = casi todo el alto del folleto. Probá 0.5 para más chica.
    const X = 0;        // izquierda (negativo) / derecha (positivo).
    const Y = 0;        // abajo (negativo) / arriba (positivo).
    const Z = 0.12;     // cuánto sobresale del papel. Más alto = más separada.

    // ===== VOZ =====
    // "archivos": usa tus grabaciones (audio1.mp3, audio2.mp3...), una por burbuja y en el mismo orden.
    // "celular": el celular lee el texto con su voz sintética (no hace falta subir archivos, pero la voz cambia según el aparato).
    // "ninguna": sin sonido, solo texto.
    const VOZ = "archivos";

    // ===== LO QUE DICE LA ARQUEÓLOGA =====
    // Cada bloque es una burbuja. "t" es el texto y "audio" es el nombre de la grabación de esa burbuja.
    const frases = [
      { t: "¡Hola! Soy la arqueóloga y hoy te voy a contar algunos secretos del Museo Etnográfico y de Santa Fe la Vieja.", audio: "audio1.mp3" },
      { t: "El edificio del Museo Etnográfico tiene una conexión directa con Santa Fe la Vieja: en sus cimientos se colocaron ladrillos provenientes de las ruinas de la antigua ciudad.", audio: "audio2.mp3" },
      { t: "El Museo Etnográfico y Colonial fue creado en 1941. Diez años después recibió el nombre de Juan de Garay, en homenaje al fundador de Santa Fe.", audio: "audio3.mp3" },
      { t: "La colección del museo incluye piezas de sociedades cazadoras, recolectoras, pescadoras y horticultoras que habitaron la región del Paraná y la llanura pampeana desde hace 2.000 años, antes de la llegada de los españoles.", audio: "audio4.mp3" },
      { t: "¡Gracias por acompañarme! Te espero en el museo para que sigas descubriendo la historia de Santa Fe.", audio: "audio5.mp3" }
    ];

    const escena = document.querySelector('a-scene');
    const objetivo = document.querySelector('#objetivo');
    const grupo = document.querySelector('#grupo');
    const burbuja = document.querySelector('#burbuja');
    const txtVisible = document.querySelector('#visible');
    const txtOculto = document.querySelector('#oculto');
    const puntos = document.querySelector('#puntos');
    const aviso = document.querySelector('#aviso');
    const ancla = document.querySelector('#ancla-burbuja');
    const inicio = document.querySelector('#inicio');
    const btn = document.querySelector('#btn');
    const ojosA = document.querySelector('#ojos-abiertos');
    const ojosC = document.querySelector('#ojos-cerrados');
    const bocaC = document.querySelector('#boca-cerrada');
    const bocaA = document.querySelector('#boca-abierta');

    // Tamaño y posición
    const s = ALTO / 2.7251;
    grupo.setAttribute('scale', s + ' ' + s + ' ' + s);
    grupo.setAttribute('position', X + ' ' + Y + ' ' + Z);

    // Orden de capas (para que las partes no se tapen mal entre sí)
    function ordenarCapas() {
      document.querySelectorAll('[data-orden]').forEach(function (el) {
        const m = el.getObject3D('mesh');
        if (m) m.renderOrder = parseInt(el.dataset.orden, 10);
      });
    }
    if (escena.hasLoaded) ordenarCapas(); else escena.addEventListener('loaded', ordenarCapas);

    // ===== Reproductor y estado =====
    const voz = new Audio();            // un solo reproductor, que se "desbloquea" con el toque inicial
    voz.preload = 'auto';
    const sintetizador = window.speechSynthesis;

    let escribiendo = false;            // el texto se está escribiendo
    let sonando = false;                // la voz está sonando
    let indice = 0, ficha = 0, reloj = null, enPantalla = false;

    function pintar(n) {
      const f = frases[indice].t;
      txtVisible.textContent = f.slice(0, n);
      txtOculto.textContent = f.slice(n);   // reserva el espacio para que la burbuja no salte
    }

    function marcarPuntos() {
      let p = '';
      for (let i = 0; i < frases.length; i++) p += (i === indice ? '●' : '○');
      puntos.textContent = p;
    }

    function detenerVoz() {
      voz.onloadedmetadata = null; voz.onended = null; voz.onerror = null;
      try { voz.pause(); } catch (e) {}
      if (sintetizador) sintetizador.cancel();
      sonando = false;
    }

    function terminarEscritura() {
      clearInterval(reloj);
      escribiendo = false;
      pintar(frases[indice].t.length);
      aviso.textContent = (indice === frases.length - 1) ? 'Tocá para repetir ↻' : 'Tocá para seguir ▸';
    }

    function escribir(msPorLetra, token) {
      if (token !== ficha || !escribiendo) return;
      clearInterval(reloj);
      let n = 0;
      pintar(0);
      reloj = setInterval(function () {
        n++;
        pintar(n);
        if (n >= frases[indice].t.length) terminarEscritura();
      }, msPorLetra);
    }

    function empezarFrase() {
      ficha++;
      const token = ficha;
      clearInterval(reloj);
      detenerVoz();
      marcarPuntos();
      aviso.textContent = '';
      escribiendo = true;
      pintar(0);
      const f = frases[indice];

      if (VOZ === 'archivos' && f.audio) {
        let arranco = false;
        const arrancar = function (ms) {
          if (arranco || token !== ficha) return;
          arranco = true;
          escribir(ms, token);
        };
        voz.onloadedmetadata = function () {
          const d = voz.duration;
          arrancar((isFinite(d) && d > 0) ? Math.max(15, (d * 1000 * 0.92) / f.t.length) : 22);
        };
        voz.onerror = function () { if (token === ficha) sonando = false; arrancar(22); };
        voz.onended = function () { if (token === ficha) sonando = false; };
        voz.src = f.audio;
        sonando = true;
        const p = voz.play();
        if (p && p.catch) p.catch(function () { if (token === ficha) sonando = false; arrancar(22); });
        setTimeout(function () { arrancar(22); }, 1500);   // por si el audio tarda o no existe

      } else if (VOZ === 'celular' && sintetizador) {
        const u = new SpeechSynthesisUtterance(f.t);
        u.lang = 'es-AR';
        const voces = sintetizador.getVoices();
        const es = voces.find(function (v) { return /^es[-_]AR/i.test(v.lang); }) ||
                   voces.find(function (v) { return /^es/i.test(v.lang); });
        if (es) u.voice = es;
        u.onend = function () { if (token === ficha) sonando = false; };
        u.onerror = function () { if (token === ficha) sonando = false; };
        sonando = true;
        sintetizador.speak(u);
        escribir(62, token);

      } else {
        escribir(22, token);
      }
    }

    // Tocar la burbuja: si todavía escribe, muestra todo el texto; si no, pasa a la siguiente
    burbuja.addEventListener('click', function () {
      if (escribiendo) {
        terminarEscritura();
      } else {
        indice = (indice + 1) % frases.length;
        empezarFrase();
      }
    });

    // Botón inicial: desbloquea el sonido y enciende la cámara
    btn.addEventListener('click', function () {
      if (VOZ === 'archivos') {
        try {
          voz.src = frases[0].audio;
          const p = voz.play();
          if (p && p.then) p.then(function () { voz.pause(); voz.currentTime = 0; }).catch(function () {});
        } catch (e) {}
      }
      if (VOZ === 'celular' && sintetizador) {
        try {
          const u = new SpeechSynthesisUtterance(' ');
          u.volume = 0;
          sintetizador.speak(u);
        } catch (e) {}
      }
      inicio.style.display = 'none';
      const arrancarCamara = function () { escena.systems['mindar-image-system'].start(); };
      if (escena.hasLoaded) arrancarCamara(); else escena.addEventListener('loaded', arrancarCamara);
    });

    // Se activa sola cuando la cámara reconoce el folleto
    objetivo.addEventListener('targetFound', function () {
      enPantalla = true;
      indice = 0;
      burbuja.style.display = 'block';
      empezarFrase();
    });
    objetivo.addEventListener('targetLost', function () {
      enPantalla = false;
      ficha++;
      clearInterval(reloj);
      escribiendo = false;
      detenerVoz();
      burbuja.style.display = 'none';
    });

    // La burbuja sigue a la arqueóloga en la pantalla
    const T3 = AFRAME.THREE;
    const punto = new T3.Vector3();
    function seguirBurbuja() {
      if (enPantalla) {
        const camObj = document.querySelector('a-camera').getObject3D('camera');
        if (camObj && ancla.object3D) {
          ancla.object3D.updateWorldMatrix(true, false);
          punto.setFromMatrixPosition(ancla.object3D.matrixWorld);
          punto.project(camObj);
          let x = (punto.x * 0.5 + 0.5) * window.innerWidth;
          let y = (-punto.y * 0.5 + 0.5) * window.innerHeight;
          if (isFinite(x) && isFinite(y)) {
            const ancho = burbuja.offsetWidth, alto = burbuja.offsetHeight;
            x = Math.min(Math.max(x, ancho / 2 + 8), window.innerWidth - ancho / 2 - 8);
            y = Math.max(y, alto + 24);          // que no se salga por arriba
            y = Math.min(y, window.innerHeight - 8);
            burbuja.style.left = x + 'px';
            burbuja.style.top = y + 'px';
          }
        }
      }
      requestAnimationFrame(seguirBurbuja);
    }
    seguirBurbuja();

    // Boca: se abre y se cierra mientras "habla"
    let bocaAbierta = false;
    setInterval(function () {
      bocaAbierta = (escribiendo || sonando) ? !bocaAbierta : false;
      bocaA.setAttribute('visible', bocaAbierta);
      bocaC.setAttribute('visible', !bocaAbierta);
    }, 160);

    // Parpadeo cada 2 a 5 segundos
    function parpadear() {
      ojosA.setAttribute('visible', false);
      ojosC.setAttribute('visible', true);
      setTimeout(function () {
        ojosA.setAttribute('visible', true);
        ojosC.setAttribute('visible', false);
      }, 150);
      setTimeout(parpadear, 2000 + Math.random() * 3000);
    }
    parpadear();
  </script>
</body>
</html>
